<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VENTIX - 3D STEM Simulation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .ui-panel {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #9ca3af;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="canvas-container"></div>

    <div class="ui-layer flex flex-col h-full w-full justify-between p-4 box-border">
        
        <!-- Top Status Bar -->
        <div class="flex justify-center w-full">
            <div id="status-badge" class="ui-panel px-6 py-2 rounded-full font-bold text-sm tracking-wide text-emerald-600 transition-colors duration-300">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                SYSTEM NORMAL
            </div>
        </div>

        <!-- Middle Section: Left Controls & Right Telemetry -->
        <div class="flex flex-col md:flex-row justify-between flex-grow mt-4 gap-4 overflow-hidden">
            
            <!-- Controls Panel -->
            <div class="ui-panel rounded-2xl p-5 w-full md:w-80 flex flex-col gap-5 overflow-y-auto shrink-0 max-h-full">
                <h2 class="font-black text-xl text-slate-900 border-b border-slate-200 pb-2">VENTIX Controls</h2>
                
                <div>
                    <div class="flex justify-between text-sm mb-1 font-semibold">
                        <span>Room Oxygen (%)</span>
                        <span id="ui-room-o2-val">20.9%</span>
                    </div>
                    <input type="range" id="ctrl-room-o2" min="17.0" max="21.5" step="0.1" value="20.9">
                    <div class="flex justify-between text-xs text-slate-400 mt-1">
                        <span>17.0</span>
                        <span><span class="text-red-400 font-bold">^</span> 19.5</span>
                        <span>21.5</span>
                    </div>
                </div>

                <button id="btn-drop-o2" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 py-2 rounded-lg text-sm font-semibold transition">
                    Simulate O₂ Drop (< 19.5%)
                </button>

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <label class="text-sm font-semibold mb-2 block">Simulation Speed</label>
                    <div class="flex gap-2">
                        <button class="sim-speed-btn flex-1 py-1 rounded bg-blue-500 text-white font-bold text-sm" data-speed="1">1x</button>
                        <button class="sim-speed-btn flex-1 py-1 rounded bg-slate-200 hover:bg-slate-300 font-bold text-sm" data-speed="10">10x</button>
                        <button class="sim-speed-btn flex-1 py-1 rounded bg-slate-200 hover:bg-slate-300 font-bold text-sm" data-speed="30">30x</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1 font-semibold">
                        <span>Louvre Angle</span>
                        <span id="ui-louvre-val">0°</span>
                    </div>
                    <input type="range" id="ctrl-louvre" min="0" max="90" step="1" value="0">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1 font-semibold">
                        <span class="text-slate-400">Fan Speed Override</span>
                    </div>
                    <input type="range" id="ctrl-fan" min="0" max="100" step="1" value="0" disabled>
                    <p class="text-[10px] text-slate-400 mt-1">Controlled automatically by O2 logic.</p>
                </div>

                <button id="btn-reset" class="mt-auto bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-lg text-sm font-bold transition">
                    System Reset
                </button>
            </div>

            <!-- Telemetry Panel -->
            <div class="ui-panel rounded-2xl p-5 w-full md:w-64 flex flex-col gap-4 overflow-y-auto shrink-0 max-h-full">
                <h2 class="font-black text-lg text-slate-900 border-b border-slate-200 pb-2">Live Telemetry</h2>
                
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Process Timer</span>
                    <span id="tel-timer" class="font-mono font-bold text-lg text-slate-800">00:00 / 05:00</span>
                </div>

                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <span class="text-sm font-medium">Algae LED State</span>
                    <span id="tel-led" class="px-2 py-0.5 rounded text-xs font-bold bg-slate-200 text-slate-500">OFF</span>
                </div>
                
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <span class="text-sm font-medium">Stored Algae O₂</span>
                    <span class="font-mono text-blue-600 font-bold"><span id="tel-stored">0.0</span> mL</span>
                </div>

                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <span class="text-sm font-medium">Outlet Temp</span>
                    <span class="font-mono text-cyan-600 font-bold"><span id="tel-temp">24.0</span> °C</span>
                </div>

                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <span class="text-sm font-medium">Throat Air Speed</span>
                    <span class="font-mono text-slate-600 font-bold"><span id="tel-speed">0.0</span> m/s</span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium">Bernoulli ΔP</span>
                    <span class="font-mono text-slate-600 font-bold"><span id="tel-press">0</span> Pa</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-center gap-4 mt-4 shrink-0">
            <!-- Camera Presets -->
            <div class="ui-panel rounded-xl p-2 flex gap-2 overflow-x-auto">
                <button class="cam-btn px-4 py-2 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded-lg text-xs font-bold transition whitespace-nowrap" data-cam="overview">Overview</button>
                <button class="cam-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition whitespace-nowrap" data-cam="venturi">Venturi Tube</button>
                <button class="cam-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition whitespace-nowrap" data-cam="algae">Algae Chamber</button>
                <button class="cam-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition whitespace-nowrap" data-cam="louvre">Louvre Outlet</button>
            </div>

            <!-- Visual Layers -->
            <div class="ui-panel rounded-xl p-2 flex gap-4 items-center px-4 overflow-x-auto text-sm font-medium">
                <label class="flex items-center gap-2 cursor-pointer whitespace-nowrap">
                    <input type="checkbox" id="layer-particles" checked class="w-4 h-4 accent-blue-600"> Air Particles
                </label>
                <label class="flex items-center gap-2 cursor-pointer whitespace-nowrap">
                    <input type="checkbox" id="layer-bubbles" checked class="w-4 h-4 accent-blue-600"> O₂ Bubbles
                </label>
                <label class="flex items-center gap-2 cursor-pointer whitespace-nowrap">
                    <input type="checkbox" id="layer-glass" checked class="w-4 h-4 accent-blue-600"> Glass Front
                </label>
                <label class="flex items-center gap-2 cursor-pointer whitespace-nowrap">
                    <input type="checkbox" id="layer-salt" checked class="w-4 h-4 accent-blue-600"> Epsom Salt
                </label>
            </div>
        </div>
    </div>

    <script>
        const STATE = {
            roomO2: 20.9,
            storedO2: 0,
            timer: 0,
            isLedOn: false,
            isFanOn: false,
            simSpeed: 1,
            louvreAngle: 0,
            fanRPM: 0,
            activeCycle: false
        };

        const CONSTANTS = {
            thresholdLow: 19.5,
            thresholdHigh: 20.5,
            cycleDuration: 300,
            ambientTemp: 24.0,
            coolingDrop: 1.5,
            xStart: -5,
            xEnd: -1,
            wideR: 2.1,
            throatR: 2.1 * 0.35
        };

        const algaeXStart = -1.0;
        const algaeXEnd = 2.0;

        function getTubeRadius(x) {
            if (x <= CONSTANTS.xStart) return CONSTANTS.wideR;
            if (x >= CONSTANTS.xEnd) return CONSTANTS.wideR;
            const t = (x - CONSTANTS.xStart) / (CONSTANTS.xEnd - CONSTANTS.xStart);
            return CONSTANTS.throatR + (CONSTANTS.wideR - CONSTANTS.throatR) * (0.5 + 0.5 * Math.cos(2 * Math.PI * t));
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdde0e5);
        scene.fog = new THREE.Fog(0xdde0e5, 15, 40);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(10, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 30;
        const d = 10;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight1 = new THREE.PointLight(0xe2e8f0, 0.6, 20);
        fillLight1.position.set(-10, 5, 5);
        scene.add(fillLight1);
        
        const fillLight2 = new THREE.PointLight(0xffffff, 0.3, 20);
        fillLight2.position.set(10, -5, -5);
        scene.add(fillLight2);

        const floorGeom = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.15 });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -4;
        floor.receiveShadow = true;
        scene.add(floor);

        const plasticMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e293b, 
            roughness: 0.7, 
            metalness: 0.2 
        });
        
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transmission: 0.95,
            opacity: 1,
            transparent: true,
            roughness: 0.05,
            ior: 1.5,
            thickness: 0.2,
            envMapIntensity: 1.0,
            depthWrite: false
        });

        const meshRefs = {
            louvres: [],
            glassFront: null,
            saltMesh: null,
            saltCrystals: null,
            hydrationParticles: null,
            fanGroup: new THREE.Group()
        };

        const unitGroup = new THREE.Group();
        scene.add(unitGroup);

        const panelThickness = 0.2;
        const w = 12; const dZ = 9; const h = 7;

        const topGeom = new THREE.BoxGeometry(w, panelThickness, dZ);
        const topPanel = new THREE.Mesh(topGeom, plasticMat);
        topPanel.position.set(0, h/2 - panelThickness/2, 0);
        topPanel.castShadow = true;
        topPanel.receiveShadow = true;
        unitGroup.add(topPanel);

        const lcdCanvas = document.createElement('canvas');
        lcdCanvas.width = 512;
        lcdCanvas.height = 128;
        const lcdCtx = lcdCanvas.getContext('2d');
        const lcdTex = new THREE.CanvasTexture(lcdCanvas);
        lcdTex.minFilter = THREE.LinearFilter;
        
        const lcdGeom = new THREE.BoxGeometry(3.2, 0.06, 1.2);
        const lcdBaseMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const lcdScreenMat = new THREE.MeshBasicMaterial({ map: lcdTex });
        const lcdMats = [lcdBaseMat, lcdBaseMat, lcdScreenMat, lcdBaseMat, lcdBaseMat, lcdBaseMat];
        const lcd = new THREE.Mesh(lcdGeom, lcdMats);
        lcd.position.set(3.2, h/2 + 0.03, 3);
        unitGroup.add(lcd);

        const bottomGeom = new THREE.BoxGeometry(w, panelThickness, dZ);
        const bottomPanel = new THREE.Mesh(bottomGeom, plasticMat);
        bottomPanel.position.set(0, -h/2 + panelThickness/2, 0);
        bottomPanel.receiveShadow = true;
        unitGroup.add(bottomPanel);

        const backGeom = new THREE.BoxGeometry(w, h - 2*panelThickness, panelThickness);
        const backPanel = new THREE.Mesh(backGeom, plasticMat);
        backPanel.position.set(0, 0, -dZ/2 + panelThickness/2);
        backPanel.receiveShadow = true;
        unitGroup.add(backPanel);

        const frontGeom = new THREE.BoxGeometry(w, h - 2*panelThickness, panelThickness);
        meshRefs.glassFront = new THREE.Mesh(frontGeom, glassMat);
        meshRefs.glassFront.position.set(0, 0, dZ/2 - panelThickness/2);
        unitGroup.add(meshRefs.glassFront);

        const leftShape = new THREE.Shape();
        leftShape.moveTo(-dZ/2, -h/2 + panelThickness);
        leftShape.lineTo(dZ/2, -h/2 + panelThickness);
        leftShape.lineTo(dZ/2, h/2 - panelThickness);
        leftShape.lineTo(-dZ/2, h/2 - panelThickness);
        leftShape.lineTo(-dZ/2, -h/2 + panelThickness);

        const leftHole = new THREE.Path();
        leftHole.absarc(0, 0, CONSTANTS.wideR, 0, Math.PI * 2, false);
        leftShape.holes.push(leftHole);

        const extrudeSet = { depth: panelThickness, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const leftGeom = new THREE.ExtrudeGeometry(leftShape, extrudeSet);
        leftGeom.center();
        leftGeom.rotateY(-Math.PI / 2);
        const leftPanel = new THREE.Mesh(leftGeom, plasticMat);
        leftPanel.position.set(-w/2 + panelThickness/2, 0, 0);
        leftPanel.castShadow = true;
        leftPanel.receiveShadow = true;
        unitGroup.add(leftPanel);

        const rightShape = new THREE.Shape();
        rightShape.moveTo(-dZ/2, -h/2 + panelThickness);
        rightShape.lineTo(dZ/2, -h/2 + panelThickness);
        rightShape.lineTo(dZ/2, h/2 - panelThickness);
        rightShape.lineTo(-dZ/2, h/2 - panelThickness);
        rightShape.lineTo(-dZ/2, -h/2 + panelThickness);

        const rHoleW = dZ - 2;
        const rHoleH = h - 2;
        const rightHole = new THREE.Path();
        rightHole.moveTo(-rHoleW/2, -rHoleH/2);
        rightHole.lineTo(rHoleW/2, -rHoleH/2);
        rightHole.lineTo(rHoleW/2, rHoleH/2);
        rightHole.lineTo(-rHoleW/2, rHoleH/2);
        rightHole.lineTo(-rHoleW/2, -rHoleH/2);
        rightShape.holes.push(rightHole);

        const rightGeom = new THREE.ExtrudeGeometry(rightShape, extrudeSet);
        rightGeom.center();
        rightGeom.rotateY(Math.PI / 2);
        const rightPanel = new THREE.Mesh(rightGeom, plasticMat);
        rightPanel.position.set(w/2 - panelThickness/2, 0, 0);
        rightPanel.castShadow = true;
        unitGroup.add(rightPanel);

        const fanZ = 0;
        const fanX = -5.8;
        
        const fanRingGeom = new THREE.TorusGeometry(CONSTANTS.wideR, 0.1, 16, 64);
        fanRingGeom.rotateY(Math.PI / 2);
        const fanFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const fanRing = new THREE.Mesh(fanRingGeom, fanFrameMat);
        fanRing.position.set(fanX, 0, 0);
        unitGroup.add(fanRing);

        // Safety Grill (Jaring Pelindung Kipas)
        const guardGroup = new THREE.Group();
        const guardMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 });
        
        const outerGuardRing = new THREE.Mesh(new THREE.TorusGeometry(CONSTANTS.wideR * 0.98, 0.04, 8, 32), guardMat);
        outerGuardRing.rotation.y = Math.PI / 2;
        guardGroup.add(outerGuardRing);

        const innerGuardRing = new THREE.Mesh(new THREE.TorusGeometry(CONSTANTS.wideR * 0.5, 0.03, 8, 24), guardMat);
        innerGuardRing.rotation.y = Math.PI / 2;
        guardGroup.add(innerGuardRing);

        for(let i=0; i<6; i++) {
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.04, CONSTANTS.wideR * 2, 0.04), guardMat);
            spoke.rotation.x = (i * Math.PI) / 3;
            guardGroup.add(spoke);
        }
        guardGroup.position.set(fanX - 0.15, 0, 0);
        unitGroup.add(guardGroup);

        const fanMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
        
        const hubGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.15, 32);
        hubGeom.rotateZ(Math.PI / 2);
        const hub = new THREE.Mesh(hubGeom, fanMat);
        meshRefs.fanGroup.add(hub);
        
        const hubHoleGeom = new THREE.CylinderGeometry(0.15, 0.15, 0.16, 16);
        hubHoleGeom.rotateZ(Math.PI / 2);
        const hubHoleMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const hubHole = new THREE.Mesh(hubHoleGeom, hubHoleMat);
        meshRefs.fanGroup.add(hubHole);
        
        for(let i=0; i<6; i++) {
            const rib = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.0, 0.04), fanMat);
            rib.rotation.x = i * Math.PI / 3;
            meshRefs.fanGroup.add(rib);
        }

        const bladeShape = new THREE.Shape();
        bladeShape.moveTo(0, 0.5);
        bladeShape.bezierCurveTo(0.5, 0.4, 1.2, 0.6, 2.0, 1.0);
        bladeShape.bezierCurveTo(2.3, 1.5, 1.8, 2.1, 0.8, 2.1);
        bladeShape.bezierCurveTo(0.3, 2.0, -0.3, 1.3, -0.1, 0.7);
        bladeShape.lineTo(0, 0.5);
        
        const bladeExtrude = { depth: 0.02, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, curveSegments: 16 };
        const bladeGeom = new THREE.ExtrudeGeometry(bladeShape, bladeExtrude);
        bladeGeom.rotateY(Math.PI / 2);
        bladeGeom.rotateY(-Math.PI * (15 / 180));

        for (let i = 0; i < 5; i++) {
            const blade = new THREE.Mesh(bladeGeom, fanMat);
            blade.rotation.x = Math.PI * (i * 72 / 180);
            meshRefs.fanGroup.add(blade);
        }

        meshRefs.fanGroup.position.set(fanX, 0, 0);
        unitGroup.add(meshRefs.fanGroup);

        const tubePoints = [];
        const steps = 64;
        for(let i = 0; i <= steps; i++) {
            let x = CONSTANTS.xStart + (i / steps) * (CONSTANTS.xEnd - CONSTANTS.xStart);
            let r = getTubeRadius(x);
            tubePoints.push(new THREE.Vector2(r, x));
        }
        
        const tubeGeom = new THREE.LatheGeometry(tubePoints, 48);
        tubeGeom.rotateZ(-Math.PI / 2);

        const tubeGlassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff, transmission: 0.8, opacity: 0.45, transparent: true,
            roughness: 0.1, ior: 1.4, side: THREE.FrontSide, depthWrite: false
        });
        const tubeBackMat = new THREE.MeshPhysicalMaterial({
            color: 0x5588cc, transmission: 0.5, opacity: 0.6, transparent: true,
            roughness: 0.2, side: THREE.BackSide, depthWrite: false
        });

        const venturiMesh = new THREE.Mesh(tubeGeom, tubeGlassMat);
        const venturiBack = new THREE.Mesh(tubeGeom, tubeBackMat);
        unitGroup.add(venturiMesh);
        unitGroup.add(venturiBack);

        const algaeW = algaeXEnd - algaeXStart;
        const chamberContainer = new THREE.Group();
        chamberContainer.position.set(algaeXStart + algaeW/2, 0, 0);
        unitGroup.add(chamberContainer);

        const algaeBoxGeom = new THREE.BoxGeometry(algaeW, h - 0.45, dZ - 0.45);
        const algaeBox = new THREE.Mesh(algaeBoxGeom, glassMat);
        chamberContainer.add(algaeBox);

        const liqHeight = 1.0;
        const liquidGeom = new THREE.BoxGeometry(algaeW - 0.1, liqHeight, dZ - 0.55);
        const liquidMat = new THREE.MeshPhysicalMaterial({
            color: 0x11aa33, transmission: 0.5, opacity: 0.85, transparent: true,
            roughness: 0.1, ior: 1.33, thickness: 1.0, depthWrite: true
        });
        const liquidMesh = new THREE.Mesh(liquidGeom, liquidMat);
        liquidMesh.position.y = -h/2 + 0.35 + (liqHeight / 2);
        chamberContainer.add(liquidMesh);

        const ledStripGeom = new THREE.BoxGeometry(algaeW - 0.2, 0.05, 0.1);
        const ledStripMat = new THREE.MeshBasicMaterial({ color: 0x004400 });
        const ledStrip = new THREE.Mesh(ledStripGeom, ledStripMat);
        ledStrip.position.set(0, h/2 - 0.3, 0);
        chamberContainer.add(ledStrip);

        const algaeLight = new THREE.PointLight(0x00ff00, 0.0, 6.0);
        algaeLight.position.set(0, h/2 - 0.5, 0);
        chamberContainer.add(algaeLight);

        const cellCount = 300;
        const cellGeom = new THREE.IcosahedronGeometry(0.04, 1);
        const cellMat = new THREE.MeshStandardMaterial({ color: 0x11aa11, roughness: 0.8 });
        const cellsInstanced = new THREE.InstancedMesh(cellGeom, cellMat, cellCount);
        const dummy = new THREE.Object3D();
        const cellData = [];
        
        for(let i=0; i<cellCount; i++) {
            let x = (Math.random() - 0.5) * (algaeW - 0.2);
            let y = -h/2 + 0.35 + Math.random() * (liqHeight - 0.1);
            let z = (Math.random() - 0.5) * (dZ - 0.6);
            dummy.position.set(x, y, z);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            dummy.updateMatrix();
            cellsInstanced.setMatrixAt(i, dummy.matrix);
            cellData.push({ x, y, z, rx: Math.random(), ry: Math.random(), speed: 0.1 + Math.random()*0.2 });
        }
        chamberContainer.add(cellsInstanced);

        const bubbleCount = 250;
        const bubbleGeom = new THREE.SphereGeometry(0.06, 8, 8);
        const bubbleMat = new THREE.MeshPhysicalMaterial({
            color: 0x22c55e, transmission: 0.9, opacity: 0.8, transparent: true, roughness: 0.0,
            emissive: 0x15803d, emissiveIntensity: 0.5
        });
        const bubblesInstanced = new THREE.InstancedMesh(bubbleGeom, bubbleMat, bubbleCount);
        const bubbleData = [];
        for(let i=0; i<bubbleCount; i++) {
            let x = (Math.random() - 0.5) * (algaeW - 0.4);
            let z = (Math.random() - 0.5) * (dZ - 0.8);
            let y = -h/2 + 0.35;
            bubbleData.push({
                x, y, z, 
                phase: Math.random() * Math.PI * 2, 
                speed: 0.5 + Math.random() * 1.5,
                active: false
            });
            dummy.position.set(x, -100, z);
            dummy.scale.setScalar(0);
            dummy.updateMatrix();
            bubblesInstanced.setMatrixAt(i, dummy.matrix);
        }
        chamberContainer.add(bubblesInstanced);

        const saltXStart = 2.0;
        const saltXEnd = 4.5;
        const saltW = saltXEnd - saltXStart;
        
        const saltContainer = new THREE.Group();
        saltContainer.position.set(saltXStart + saltW/2, 0, 0);
        unitGroup.add(saltContainer);

        const saltFrameGeom = new THREE.BoxGeometry(saltW, h - 0.45, dZ - 0.45);
        const saltFrameMat = new THREE.MeshPhysicalMaterial({
            color: 0xdddddd, transmission: 0.9, opacity: 0.6, transparent: true, roughness: 0.2,
            polygonOffset: true, polygonOffsetFactor: 1
        });
        meshRefs.saltMesh = new THREE.Mesh(saltFrameGeom, saltFrameMat);
        saltContainer.add(meshRefs.saltMesh);

        const crystalCount = 1200;
        const crystalGeom = new THREE.DodecahedronGeometry(0.17, 0);
        const crystalMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff,
            emissive: 0x0284c7, 
            emissiveIntensity: 0.15, 
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            transmission: 0.0,
            opacity: 1.0,
            transparent: false 
        });
        
        meshRefs.saltCrystals = new THREE.InstancedMesh(crystalGeom, crystalMat, crystalCount);
        meshRefs.saltCrystals.castShadow = true;
        meshRefs.saltCrystals.receiveShadow = true;
        
        const safeW = saltW - 0.4;
        const safeH = h - 0.8;
        const safeD = dZ - 0.8;

        for(let i=0; i<crystalCount; i++) {
            let x = (Math.random() - 0.5) * safeW;
            let y = (Math.random() - 0.5) * safeH;
            let z = (Math.random() - 0.5) * safeD;
            
            dummy.position.set(x, y, z);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            let scale = 0.6 + Math.random() * 0.6;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            meshRefs.saltCrystals.setMatrixAt(i, dummy.matrix);
        }
        saltContainer.add(meshRefs.saltCrystals);

        const hydrationCount = 800;
        const hydGeom = new THREE.SphereGeometry(0.06, 8, 8);
        const hydMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
        meshRefs.hydrationParticles = new THREE.InstancedMesh(hydGeom, hydMat, hydrationCount);
        
        for(let i=0; i<hydrationCount; i++) {
            let x = (Math.random() - 0.5) * safeW;
            let y = (Math.random() - 0.5) * safeH;
            let z = (Math.random() - 0.5) * safeD;
            
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            meshRefs.hydrationParticles.setMatrixAt(i, dummy.matrix);
        }
        saltContainer.add(meshRefs.hydrationParticles);

        const louvreX = 5.6;
        const numSlats = 8;
        const slatW = 0.5;
        const slatH = 0.1;
        const slatD = dZ - 2.2;
        const slatSpacing = (h - 2.2) / numSlats;
        
        const slatGeom = new THREE.BoxGeometry(slatW, slatH, slatD);
        const slatMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5 });
        
        const startY = -(h - 2.2)/2 + slatSpacing/2;
        
        for(let i=0; i<numSlats; i++) {
            const slat = new THREE.Mesh(slatGeom, slatMat);
            slat.position.set(louvreX, startY + i * slatSpacing, 0);
            unitGroup.add(slat);
            meshRefs.louvres.push(slat);
        }

        const numAirParticles = 600;
        const particleGeom = new THREE.SphereGeometry(0.05, 12, 12);
        
        const particleMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1,
            transparent: true,
            opacity: 0.9
        });

        const airParticlesMesh = new THREE.InstancedMesh(particleGeom, particleMat, numAirParticles);
        unitGroup.add(airParticlesMesh);

        const pState = [];
        for(let i=0; i<numAirParticles; i++) {
            pState.push({
                x: CONSTANTS.xStart + Math.random() * (6.0 - CONSTANTS.xStart),
                fraction: Math.random(),
                angle: Math.random() * Math.PI * 2,
                baseSpeed: 0.25 + Math.random() * 0.35
            });
        }

        const colorIncoming = new THREE.Color(0x1d4ed8);
        const colorO2 = new THREE.Color(0x0ea5e9);
        const colorCool = new THREE.Color(0x60a5fa);
        const tempColor = new THREE.Color();
        const clock = new THREE.Clock();

        function updateLCD() {
            lcdCtx.fillStyle = '#0a0a0a';
            lcdCtx.fillRect(0, 0, 512, 128);
            
            lcdCtx.fillStyle = STATE.roomO2 < CONSTANTS.thresholdLow ? '#ff3333' : '#3b82f6';
            lcdCtx.font = 'bold 36px monospace';
            lcdCtx.fillText(`O2: ${STATE.roomO2.toFixed(1)}%`, 25, 45);
            
            let min = Math.floor(STATE.timer / 60).toString().padStart(2, '0');
            let sec = Math.floor(STATE.timer % 60).toString().padStart(2, '0');
            lcdCtx.fillStyle = '#eeeeee';
            lcdCtx.font = '28px monospace';
            lcdCtx.fillText(`TMR: ${min}:${sec}`, 25, 90);
            
            lcdCtx.font = '20px monospace';
            lcdCtx.fillStyle = STATE.isLedOn ? '#22c55e' : '#444444';
            lcdCtx.fillText(`LED:${STATE.isLedOn ? 'ON' : 'OFF'}`, 280, 45);
            
            lcdCtx.fillStyle = STATE.isFanOn ? '#06b6d4' : '#444444';
            lcdCtx.fillText(`FAN:${STATE.isFanOn ? 'ON' : 'OFF'}`, 280, 90);

            lcdTex.needsUpdate = true;
        }

        function updateSimulation(dt) {
            const simDt = dt * STATE.simSpeed;

            if (STATE.roomO2 < CONSTANTS.thresholdLow) {
                STATE.activeCycle = true;
                STATE.isLedOn = true;
                
                if (STATE.timer < CONSTANTS.cycleDuration) {
                    STATE.timer += simDt;
                    if(STATE.timer > CONSTANTS.cycleDuration) STATE.timer = CONSTANTS.cycleDuration;
                    
                    STATE.storedO2 += simDt * 3.5;
                    STATE.isFanOn = false;
                } else {
                    STATE.isFanOn = true;
                    STATE.storedO2 += simDt * 3.5;
                    
                    let o2Transfer = simDt * 15.0;
                    if (STATE.storedO2 < o2Transfer) o2Transfer = STATE.storedO2;
                    
                    STATE.storedO2 -= o2Transfer;
                    if (STATE.storedO2 < 0) STATE.storedO2 = 0;
                }
            } else {
                STATE.activeCycle = false;
                STATE.isLedOn = false;
                STATE.isFanOn = false;
                STATE.timer = 0;
            }
            
            updateLCD();

            ledStripMat.color.setHex(STATE.isLedOn ? 0x00ff00 : 0x004400);
            algaeLight.intensity = THREE.MathUtils.lerp(algaeLight.intensity, STATE.isLedOn ? 4.0 : 0.0, dt * 5);
            
            const targetRPM = STATE.isFanOn ? 1800 : 0;
            STATE.fanRPM = THREE.MathUtils.lerp(STATE.fanRPM, targetRPM, dt * 2);
            const rps = STATE.fanRPM / 60;
            meshRefs.fanGroup.rotation.x -= (rps * Math.PI * 2) * dt;

            document.getElementById('ui-room-o2-val').innerText = STATE.roomO2.toFixed(1) + '%';
            document.getElementById('ctrl-room-o2').value = STATE.roomO2;
            
            let min = Math.floor(STATE.timer / 60).toString().padStart(2, '0');
            let sec = Math.floor(STATE.timer % 60).toString().padStart(2, '0');
            document.getElementById('tel-timer').innerText = `${min}:${sec} / 05:00`;
            
            const ledBadge = document.getElementById('tel-led');
            ledBadge.innerText = STATE.isLedOn ? "ON (ACTIVE)" : "OFF";
            ledBadge.className = STATE.isLedOn ? "px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700" : "px-2 py-0.5 rounded text-xs font-bold bg-slate-200 text-slate-500";
            
            document.getElementById('tel-stored').innerText = STATE.storedO2.toFixed(1);
            
            const outletTemp = STATE.isFanOn ? (CONSTANTS.ambientTemp - CONSTANTS.coolingDrop) : CONSTANTS.ambientTemp;
            document.getElementById('tel-temp').innerText = outletTemp.toFixed(1);

            document.getElementById('ctrl-fan').value = (STATE.fanRPM / 1800) * 100;

            const speedBadge = document.getElementById('tel-speed');
            const pressBadge = document.getElementById('tel-press');
            
            if (STATE.isFanOn) {
                const v1 = 1.0;
                const areaRatio = Math.pow(CONSTANTS.wideR / CONSTANTS.throatR, 2);
                const v2 = v1 * areaRatio;
                speedBadge.innerText = v2.toFixed(1);
                
                const dp = 0.5 * 1.225 * (v2*v2 - v1*v1);
                pressBadge.innerText = dp.toFixed(0);
            } else {
                speedBadge.innerText = "0.0";
                pressBadge.innerText = "0";
            }

            const mainBadge = document.getElementById('status-badge');
            if (STATE.activeCycle) {
                mainBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-2 animate-pulse"></span>O2 LOW - SYSTEM ACTIVE';
                mainBadge.className = "ui-panel px-6 py-2 rounded-full font-bold text-sm tracking-wide text-red-600 transition-colors duration-300 border-red-200";
            } else {
                mainBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>SYSTEM NORMAL';
                mainBadge.className = "ui-panel px-6 py-2 rounded-full font-bold text-sm tracking-wide text-emerald-600 transition-colors duration-300 border-emerald-200";
            }
        }

        function updateAnimations(dt) {
            const time = clock.getElapsedTime();

            for(let i=0; i<cellCount; i++) {
                let data = cellData[i];
                data.rx += data.speed * dt;
                data.ry += data.speed * dt;
                dummy.position.set(data.x, data.y + Math.sin(time + i)*0.02, data.z);
                dummy.rotation.set(data.rx, data.ry, 0);
                dummy.updateMatrix();
                cellsInstanced.setMatrixAt(i, dummy.matrix);
            }
            cellsInstanced.instanceMatrix.needsUpdate = true;

            let activeBubbleTarget = 0;
            if (STATE.isLedOn) {
                activeBubbleTarget = Math.floor((STATE.timer / CONSTANTS.cycleDuration) * bubbleCount);
                if (activeBubbleTarget < 5) activeBubbleTarget = 5;
            }

            for(let i=0; i<bubbleCount; i++) {
                let data = bubbleData[i];
                
                if (i < activeBubbleTarget) {
                    data.active = true;
                    data.y += data.speed * dt * STATE.simSpeed;
                    let wX = data.x + Math.sin(time * 5 + data.phase) * 0.05;
                    let wZ = data.z + Math.cos(time * 4 + data.phase) * 0.05;
                    
                    if (data.y > h/2 - 0.6) {
                        data.y = -h/2 + 0.35;
                        data.x = (Math.random() - 0.5) * (algaeW - 0.4);
                        data.z = (Math.random() - 0.5) * (dZ - 0.8);
                    }
                    dummy.position.set(wX, data.y, wZ);
                    
                    let scale = 1.0;
                    if(data.y > h/2 - 0.8) scale = (h/2 - 0.6 - data.y) / 0.2;
                    dummy.scale.setScalar(Math.max(0, scale));

                } else {
                    data.active = false;
                    dummy.position.set(0, -100, 0);
                    dummy.scale.setScalar(0);
                }
                dummy.updateMatrix();
                bubblesInstanced.setMatrixAt(i, dummy.matrix);
            }
            bubblesInstanced.instanceMatrix.needsUpdate = true;

            const fanMult = Math.min(1.0, STATE.fanRPM / 1800);
            
            for(let i=0; i<numAirParticles; i++) {
                let p = pState[i];
                
                if (fanMult > 0.01 && document.getElementById('layer-particles').checked) {
                    
                    let currentMaxR = CONSTANTS.wideR;
                    
                    if (p.x >= CONSTANTS.xStart && p.x <= CONSTANTS.xEnd) {
                        currentMaxR = getTubeRadius(p.x) - 0.25;
                    } else if (p.x > CONSTANTS.xEnd && p.x <= 4.5) {
                        let targetR = CONSTANTS.throatR + (p.x - CONSTANTS.xEnd) * 0.8;
                        currentMaxR = Math.min(2.4, targetR);
                    } else if (p.x > 4.5) {
                        let t = (p.x - 4.5) / 1.5;
                        currentMaxR = THREE.MathUtils.lerp(2.4, 2.0, Math.min(1.0, t));
                    }
                    
                    let activeR = p.fraction * currentMaxR;
                    if (activeR < 0) activeR = 0;

                    const effectiveR = Math.max(0.2, currentMaxR);
                    const areaRatio = Math.pow(CONSTANTS.wideR / effectiveR, 1.8);
                    let currentSpeed = p.baseSpeed * areaRatio * fanMult * 1.5;
                    
                    p.x += currentSpeed * dt;

                    if (p.x > 10.0) {
                        p.x = CONSTANTS.xStart - 0.5;
                        p.fraction = Math.random();
                    }

                    let deflectY = 0;
                    if (p.x > 5.6) {
                        const rad = STATE.louvreAngle * Math.PI / 180;
                        deflectY = Math.tan(rad) * (p.x - 5.6);
                        dummy.rotation.set(0, 0, rad);
                    } else {
                        dummy.rotation.set(0, 0, 0);
                    }

                    let y = activeR * Math.sin(p.angle) + deflectY;
                    let z = activeR * Math.cos(p.angle);
                    
                    dummy.position.set(p.x, y, z);
                    
                    let currentScale = 1.4;

                    if (p.x < -1.0) {
                        tempColor.copy(colorIncoming);
                        currentScale = 1.4;
                    } else if (p.x >= -1.0 && p.x < 2.0) {
                        tempColor.copy(colorO2);
                        currentScale = 1.0;
                    } else {
                        tempColor.copy(colorCool);
                        currentScale = 0.8;
                    }
                    airParticlesMesh.setColorAt(i, tempColor);

                    dummy.scale.set(currentScale, currentScale, currentScale);
                    dummy.updateMatrix();
                    airParticlesMesh.setMatrixAt(i, dummy.matrix);

                } else {
                    dummy.position.set(0, -100, 0);
                    dummy.updateMatrix();
                    airParticlesMesh.setMatrixAt(i, dummy.matrix);
                }
            }
            airParticlesMesh.instanceMatrix.needsUpdate = true;
            if(fanMult > 0) airParticlesMesh.instanceColor.needsUpdate = true;
        }

        let camAnimating = false;
        const targetCamPos = new THREE.Vector3();
        const targetCamLook = new THREE.Vector3();

        function setCamera(pos, look) {
            targetCamPos.copy(pos);
            targetCamLook.copy(look);
            camAnimating = true;
        }

        document.querySelectorAll('.cam-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cam = e.target.dataset.cam;
                if(cam === 'overview') setCamera(new THREE.Vector3(10, 8, 15), new THREE.Vector3(0, 0, 0));
                if(cam === 'venturi') setCamera(new THREE.Vector3(-4, 1, 9), new THREE.Vector3(-3, 0, 0));
                if(cam === 'algae') setCamera(new THREE.Vector3(0.5, 1, 8), new THREE.Vector3(0.5, 0, 0));
                if(cam === 'louvre') setCamera(new THREE.Vector3(8, 0, 8), new THREE.Vector3(5, 0, 0));
                
                document.querySelectorAll('.cam-btn').forEach(b => { b.classList.remove('bg-blue-100','text-blue-700'); b.classList.add('bg-slate-100'); });
                e.target.classList.add('bg-blue-100','text-blue-700');
                e.target.classList.remove('bg-slate-100');
            });
        });

        document.getElementById('layer-particles').addEventListener('change', (e) => {
            airParticlesMesh.visible = e.target.checked;
        });
        document.getElementById('layer-bubbles').addEventListener('change', (e) => {
            bubblesInstanced.visible = e.target.checked;
        });
        document.getElementById('layer-glass').addEventListener('change', (e) => {
            meshRefs.glassFront.visible = e.target.checked;
        });
        document.getElementById('layer-salt').addEventListener('change', (e) => {
            meshRefs.saltMesh.visible = e.target.checked;
            meshRefs.saltCrystals.visible = e.target.checked;
            meshRefs.hydrationParticles.visible = e.target.checked;
        });

        document.getElementById('ctrl-room-o2').addEventListener('input', (e) => {
            STATE.roomO2 = parseFloat(e.target.value);
            if(STATE.roomO2 >= CONSTANTS.thresholdHigh && STATE.activeCycle) {
                STATE.activeCycle = false;
                STATE.isLedOn = false;
                STATE.isFanOn = false;
                STATE.timer = 0;
            }
        });

        document.getElementById('btn-drop-o2').addEventListener('click', () => {
            STATE.roomO2 = 18.5;
        });

        document.querySelectorAll('.sim-speed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                STATE.simSpeed = parseInt(e.target.dataset.speed);
                document.querySelectorAll('.sim-speed-btn').forEach(b => {
                    b.classList.remove('bg-blue-500', 'text-white');
                    b.classList.add('bg-slate-200');
                });
                e.target.classList.add('bg-blue-500', 'text-white');
                e.target.classList.remove('bg-slate-200');
            });
        });

        document.getElementById('ctrl-louvre').addEventListener('input', (e) => {
            STATE.louvreAngle = parseInt(e.target.value);
            document.getElementById('ui-louvre-val').innerText = STATE.louvreAngle + '°';
            const rad = STATE.louvreAngle * Math.PI / 180;
            meshRefs.louvres.forEach(slat => {
                slat.rotation.z = rad;
            });
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            STATE.roomO2 = 20.9;
            STATE.storedO2 = 0;
            STATE.timer = 0;
            STATE.activeCycle = false;
            STATE.isLedOn = false;
            STATE.isFanOn = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            updateSimulation(dt);
            updateAnimations(dt);

            if (camAnimating) {
                camera.position.lerp(targetCamPos, 0.05);
                controls.target.lerp(targetCamLook, 0.05);
                if (camera.position.distanceTo(targetCamPos) < 0.05) {
                    camAnimating = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        clock.start();
        animate();

    </script>
</body>
</html>
